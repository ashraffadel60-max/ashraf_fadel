 name: Secure RDP Windows 11

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install and Connect Tailscale
        run: |
          Set-ExecutionPolicy Bypass -Scope Process -Force
          Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest.msi" -OutFile "tailscale-setup.msi"
          Start-Process -FilePath "msiexec.exe" -ArgumentList "/i tailscale-setup.msi /quiet /norestart" -Wait
          & "C:\Program Files\Tailscale\tailscale.exe" up --authkey=tskey-auth-kHfXS3JAKZ11CNTRL-fjmcGuMX9eYLaPKvwTHEeYLPE12vbpckE --hostname=windows-rdp

      - name: Enable RDP
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1

      - name: Set Password
        run: |
          net user administrator mr.english2008

      - name: Keep Alive
        run: |
          Start-Sleep -Seconds 21600
